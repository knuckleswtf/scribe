name: Tests

on:
  push:
    branches: [v4, v5]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # composer.json allows Laravel ^9.21, but the test suite itself needs 9.41+
        # (Rule::enum() only exists from 9.41.0), so that is the floor we pin here.
        include:
          - { php: '8.1', laravel: '^9.41', deps: lowest }
          - { php: '8.1', laravel: '^9.41', deps: highest }
          - { php: '8.1', laravel: '^10.0', deps: highest }
          - { php: '8.2', laravel: '^11.0', deps: highest }
          - { php: '8.2', laravel: '^12.0', deps: highest }
          - { php: '8.3', laravel: '^12.0', deps: highest }
          - { php: '8.3', laravel: '^13.0', deps: highest }
          - { php: '8.4', laravel: '^13.0', deps: highest }

    name: Tests (PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.deps }})

    steps:
      - name: '🛎 Checkout'
        uses: actions/checkout@v7

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: xdebug

      - name: Install dependencies
        run: |
          composer update --no-interaction --prefer-dist \
            ${{ matrix.deps == 'lowest' && '--prefer-lowest --prefer-stable' || '' }} \
            --with="laravel/framework:${{ matrix.laravel }}"

      - name: Execute tests
        run: composer test-ci
